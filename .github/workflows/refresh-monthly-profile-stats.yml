name: Refresh monthly profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Record monthly refresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          date -u +%F > .github/monthly-stats-last-refreshed.txt

      - name: Commit refresh marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/monthly-stats-last-refreshed.txt
          if git diff --cached --quiet; then
            echo "No monthly refresh change."
            exit 0
          fi
          git commit -m "Refresh monthly profile stats"
          git push
