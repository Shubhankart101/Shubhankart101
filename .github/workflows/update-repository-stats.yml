name: Update GitHub repository statistics

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_repository_stats.py'
      - 'tests/test_update_repository_stats.py'
      - '.github/workflows/update-repository-stats.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stats generator
        run: python -m unittest discover -s tests -v
      - name: Refresh README and Pages snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repository_stats.py
      - name: Commit refreshed repository statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md portfolio-website/frontend/public/repos.json
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub repository statistics"
          git push